name: attendance_budget_app
description: تطبيق إدارة الدوام والميزانية الشخصية

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 🗄️ التخزين المحلي
  path_provider: ^2.1.1
  isar: ^3.1.0
  isar_community: ^3.1.0+1
  isar_community_flutter_libs: ^3.1.0+1

  # 🔄 إدارة الحالة
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.7

  # 🔐 المصادقة الحيوية
  local_auth: ^2.1.8

  # 🔔 التنبيهات
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # 📊 الرسوم البيانية
  fl_chart: ^0.66.0

  # 🎨 التصميم
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0

  # 🛠️ أدوات مساعدة
  intl: ^0.20.2
  equatable: ^2.0.5
  pdf: ^3.12.0
  share_plus: ^10.1.4
  printing: ^5.14.3
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.16.1
  isar_community_generator: ^3.3.2
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  # خط عربي مدمج يخدم غرضين: واجهة التطبيق وملفات PDF.
  # مدمج لا مُحمَّل من الشبكة — التطبيق يعمل بلا اتصال، و google_fonts
  # كان يجلب الخط وقت التشغيل فيسقط صامتاً على جهاز بلا إنترنت.
  fonts:
    # Cairo خط الهوية للواجهة. متغيّر (variable) — الأوزان تُختار بـ
    # fontVariations لا بملف لكل وزن.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf

    # Tajawal يبقى لتقارير PDF: حزمة pdf لا تدعم الخطوط المتغيّرة.
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

# تجربة: هل قيد المحلّل في isar_community_generator محافظ أم حقيقي؟
# Dart 3.13 يحتاج analyzer 13+، والمولّد يعلن <11.
dependency_overrides:
  analyzer: ^14.3.0
  dart_style: ^3.1.13
  source_gen: ^4.3.0
  build: ^4.0.11
