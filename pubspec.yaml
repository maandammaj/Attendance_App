name: attendance_budget_app
description: تطبيق إدارة الدوام والميزانية الشخصية

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 🗄️ التخزين المحلي
  path_provider: ^2.1.1
  isar: ^3.1.0
  isar_community: ^3.1.0+1
  isar_community_flutter_libs: ^3.1.0+1

  # 🔄 إدارة الحالة
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # 🔐 المصادقة الحيوية
  local_auth: ^2.1.8

  # 🔔 التنبيهات
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # 📊 الرسوم البيانية
  fl_chart: ^0.66.0

  # 🎨 التصميم
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0

  # 🛠️ أدوات مساعدة
  intl: ^0.20.2
  equatable: ^2.0.5
  pdf: ^3.12.0
  share_plus: ^10.1.4
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  isar_community_generator: ^3.1.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  # خط عربي مدمج: حزمة pdf تحتاج بايتات الخط ولا تقرأ من google_fonts.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700